<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceOrbit - Tracked Products</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- FastAPI (use this instead when deploying)
  <link rel="stylesheet" href="/static/css/main.css">
  -->

  <!-- Live Server -->
  <link rel="stylesheet" href="../static/css/main.css" />
</head>

<body>
  <!-- Top Header Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <img src="../static/images/logo.png" alt="PriceOrbit Logo">
      </div>

      <div class="topbar-right">
        <button class="btn-track-product" type="button">
          <i class="fa-solid fa-plus"></i> Track Product
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar + Content -->
  <div class="layout">
    <aside class="sidebar">
      <ul>
        <li>
          <a href="products.html" class="active">
            <span class="icon"><i class="fa-solid fa-chart-line"></i></span>
            <span class="text">Dashboard</span>
          </a>
        </li>

        <li>
          <a href="#tracked_products">
            <span class="icon"><i class="fa-solid fa-box"></i></span>
            <span class="text">Tracked Products</span>
          </a>
        </li>

        <li>
          <a href="#store-locator">
            <span class="icon"><i class="fa-solid fa-store"></i></span>
            <span class="text">Store Locator</span>
          </a>
        </li>

        <li>
          <a href="#alerts">
            <span class="icon"><i class="fa-solid fa-bell"></i></span>
            <span class="text">Alerts</span>
          </a>
        </li>

        <li>
          <a href="#settings">
            <span class="icon"><i class="fa-solid fa-gear"></i></span>
            <span class="text">Settings</span>
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <h1>Dashboard</h1>
        <p>Monitor price trends and health scores for your products</p>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>Loading products...</p>
      </div>

      <!-- Error State -->
      <div id="error" class="error-state" style="display:none;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p id="error-text"></p>
      </div>

      <!-- Products List -->
      <div id="products-list" class="products-list">
        <!-- JS injects products here -->
      </div>
    </main>
  </div>

  <script src="../static/js/products.js"></script>
</body>
</html>
