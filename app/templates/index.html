<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceOrbit - Login</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- for use w live server & link css -->
  <link rel="stylesheet" href="../static/css/main.css">

  <!-- for use w FastAPI (comment out above and uncomment below when deploying) 
  <!-- <link rel="stylesheet" href="/static/css/main.css"> -->
</head>

<body>
  <!-- Header with logo and navigation -->
  <header>
    <div class="logo">
      <img src="../static/images/logo.png" alt="PriceOrbit Logo">
    </div>
    <nav>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  
  <!-- Main content area -->
  <main>
    <!-- Left side - Welcome text -->
    <div class="welcome-text">
      <h1>Welcome to PriceOrbit</h1>
      <p>Track product prices and predict market trends with tariff intelligence.</p>
    </div>

    <!-- Right side - Login form -->
    <div class="login-box">
      <h2>Login</h2>
      
      <form>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" required>
        </div>

        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit">Sign In</button>

        <p class="signup-link">Don't have an account? <a href="#signup">Sign up</a></p>
      </form>
    </div>
  </main>

</body>
</html>
