name: PriceOrbit Tariff Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  sync-tariffs:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$MYSQL_PASSWORD"
          test -n "$KROGER_CLIENT_ID"
          test -n "$KROGER_CLIENT_SECRET"
          test -n "$SECRET_KEY"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure latest schema
        run: |
          alembic upgrade head

      - name: Sync tariffs from USITC and resolve product records
        run: |
          python scripts/update_tariffs_from_usitc.py --resolve-products --resolve-limit 500 --show-changes 25
