name: PriceOrbit Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      MYSQL_PASSWORD: ${{ secrets.PROD_MYSQL_PASSWORD }}
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$MYSQL_PASSWORD"
          test -n "$KROGER_CLIENT_ID"
          test -n "$KROGER_CLIENT_SECRET"
          test -n "$SECRET_KEY"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations on production database
        run: |
          alembic upgrade head

      - name: Trigger Render deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Deployment reminder
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "RENDER_DEPLOY_HOOK_URL is not configured."
          echo "Set it in repository secrets to enable automatic deploy trigger."
